version: '3'
services:
  web:
    build: .
    container_name: django_app
    valumes:
      - .:/app
    expose:
      - "8000"
  caddy:
    image: caddy:latest
    container_name: caddy_server
    ports:
      - "80:80"
      - "443:443"
    valumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - web
