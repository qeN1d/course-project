{% extends "app/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="form-card">
    <h1>{{ title }}</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="button" type="submit">
            Сохранить
        </button>
    </form>
</div>
{% endblock %}
